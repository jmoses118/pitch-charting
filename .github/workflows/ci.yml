name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in logic.js app.js sw.js js/core/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test test/logic.test.js
