name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in logic.js sw.js js/core/*.js js/ui/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test test/logic.test.js
  ui:
    # Playwright browser tests against a local static server (Supabase is blocked inside every test; test data only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright-core (uses the runner's Google Chrome)
        run: npm install --no-save --no-package-lock playwright-core@1.59.1 && test -x /usr/bin/google-chrome
      - name: Serve the app
        run: (python3 -m http.server 8766 >/tmp/http.log 2>&1 &) && for i in $(seq 1 20); do curl -sf http://localhost:8766/ >/dev/null && break; sleep 0.5; done
      - name: Smoke test
        run: node test/ui.smoke.js 8766
      - name: XSS test
        run: node test/xss.ui.js http://localhost:8766/
      - name: Shake-off regression (button in both layouts) + scoring lock
        run: node test/shake.ui.js http://localhost:8766/ && node test/lock.ui.js http://localhost:8766/
      - name: Shared scoring flow
        run: node test/flow.ui.js http://localhost:8766/
      - name: Sheets, recent list, and fit
        run: node test/sheets.ui.js http://localhost:8766/ && node test/zonegfx.ui.js http://localhost:8766/ && node test/fit.ui.js http://localhost:8766/
      - name: Way-off and actual-only locations
        run: node test/wayoff.ui.js http://localhost:8766/
      - name: Jersey number
        run: node test/jersey.ui.js http://localhost:8766/
  flow6a:
    name: FLOW-6a Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pitch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Clear bullpen results and assert game results stay
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: pitch
        run: bash test/flow6a.pg.sh && bash test/badaim.pg.sh
